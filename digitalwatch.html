
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock with Date</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .clock-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px #cccccc;
        }

        h1 {
            color: #6c5ce7;
        }

        #time {
            font-size: 45px;
            font-weight: bold;
            color: #333333;
            margin: 20px 0;
        }

        #date {
            font-size: 20px;
            color: #77718f;
        }
    </style>
</head>

<body>

    <div class="clock-box">
        <h1>🕒 Digital Clock</h1>

        <div id="time">00:00:00</div>
        <div id="date">Loading date...</div>
    </div>

    <script>
        function updateClock() {
            let now = new Date();

            let time = now.toLocaleTimeString("en-IN", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            });

            let date = now.toLocaleDateString("en-IN", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            document.getElementById("time").textContent = time;
            document.getElementById("date").textContent = date;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
