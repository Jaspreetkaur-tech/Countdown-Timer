<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #f4f3ff;
    }

    .timer-card {
        width: 450px;
        padding: 40px;
        text-align: center;
        background: white;
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    h1 {
        margin-bottom: 25px;
    }

    .inputs {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    label {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    input {
        width: 90px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        text-align: center;
        font-size: 18px;
    }

    .time {
        font-size: 80px;
        font-weight: bold;
        margin: 20px 0 30px;
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    button {
        padding: 12px 22px;
        border: none;
        border-radius: 10px;
        background: #6c5ce7;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.85;
    }

    .secondary {
        background: #a29bfe;
    }
</style>
</head>

<body>

<div class="timer-card">

    <h1>⏳ Countdown Timer</h1>

    <div class="inputs">

        <label>
            Minutes
            <input id="minutes" type="number" min="0" value="1">
        </label>

        <label>
            Seconds
            <input id="seconds" type="number" min="0" max="59" value="0">
        </label>

    </div>

    <div class="time" id="display">01:00</div>

    <div class="controls">
        <button id="start">Start</button>
        <button id="pause" class="secondary">Pause</button>
        <button id="reset" class="secondary">Reset</button>
    </div>

</div>

<script>

let remaining = 60;
let timer = null;

const display = document.getElementById("display");
const minutesInput = document.getElementById("minutes");
const secondsInput = document.getElementById("seconds");

function updateDisplay() {

    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;

    display.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");
}


function setTime() {

    const minutes =
        Math.max(0, Number(minutesInput.value) || 0);

    const seconds =
        Math.min(59, Math.max(0, Number(secondsInput.value) || 0));

    remaining = minutes * 60 + seconds;

    updateDisplay();
}


document.getElementById("start").onclick = function () {

    if (timer || remaining <= 0) {
        return;
    }

    timer = setInterval(function () {

        remaining--;

        updateDisplay();

        if (remaining <= 0) {

            clearInterval(timer);

            timer = null;

            alert("Time's up!");
        }

    }, 1000);
};


document.getElementById("pause").onclick = function () {

    clearInterval(timer);

    timer = null;
};


document.getElementById("reset").onclick = function () {

    clearInterval(timer);

    timer = null;

    setTime();
};


minutesInput.onchange = setTime;
secondsInput.onchange = setTime;

updateDisplay();

</script>

</body>
</html>
